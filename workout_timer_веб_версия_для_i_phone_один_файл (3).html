<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Тренировки — Таймер</title>
  <!-- iOS standalone full‑screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0ea5e9" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --muted: #9ca3af;
      --text: #e5e7eb;
      --accent: #60a5fa;
      --ok: #34d399;
      --rest: #93c5fd;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 800px at 70% -20%, #12223a, var(--bg));
      color: var(--text); line-height: 1.35;
    }
    .container { max-width: 860px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 16px; }
    h1 { font-size: 28px; margin: 0; letter-spacing: .2px; }
    .btn {
      border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 600; color: #0b1220; background: var(--accent);
      cursor: pointer; transition: transform .06s ease; box-shadow: 0 6px 14px rgba(0,0,0,.25);
    }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn.secondary { background: #1f2937; color: var(--text); }
    .btn.ghost { background: transparent; color: var(--muted); border:1px solid #293242; }
    .btn.danger { background: var(--danger); color:#111; }

    .list { display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 12px; }
    .card { background: linear-gradient(180deg,#0f172a,#0b1220); border:1px solid #1f2a3d; padding: 14px; border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 10px 30px rgba(0,0,0,.25); }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .sub { color: var(--muted); font-size: 13px; }
    .row { display:flex; align-items:center; gap:8px; }
    .row.right { justify-content: flex-end; }
    .spacer { flex:1; }

    .empty { text-align:center; color: var(--muted); padding: 24px; border:1px dashed #263041; border-radius: 16px; }

    dialog.modal { width:min(720px,95vw); border:1px solid #263041; background:#0b1220; color:var(--text); border-radius:16px; padding:0; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .modal header { padding:12px 16px; border-bottom:1px solid #1e293b; }
    .modal main { padding: 12px 16px 16px; }
    .modal footer { display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; border-top:1px solid #1e293b; }

    .field { display:flex; flex-direction:column; gap:6px; margin:10px 0; }
    .field label { font-size: 13px; color: var(--muted); }
    .input, select { background:#0f172a; color:var(--text); border:1px solid #243041; border-radius:12px; padding:10px 12px; font-size:15px; }
    .grid { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }

    .exlist { display:flex; flex-direction:column; gap:8px; }
    .ex { border:1px solid #253246; background:#0f172a; border-radius:14px; padding:10px; }

    .run { display:grid; gap:16px; }
    .circle {
      --p: 0.0turn;
      width: 260px; height: 260px; margin: 12px auto; border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #0b1220 55%, transparent 56%),
        conic-gradient(var(--ring-color, #fff) 0turn var(--p), #1f2937 var(--p) 1turn);
      box-shadow: inset 0 0 0 12px #111827;
      display:grid; place-items:center;
    }
    .time { font: 700 56px/1.1 ui-rounded, system-ui, -apple-system, Segoe UI; letter-spacing: .5px; }
    .phase { text-align:center; color: var(--muted); font-weight:600; letter-spacing:.3px; }

    .toolbar { display:flex; gap:8px; justify-content:center; }

    .chip { background:#0f172a; border:1px solid #233044; color:var(--muted); padding:6px 10px; border-radius:999px; font-size:13px; }

    .muted { color: var(--muted); }
    .hidden { display:none !important; }

    /* Upcoming list */
    .upcoming { margin-top: 6px; border-top:1px solid #1e293b; padding-top:10px; }
    .upcoming h4 { margin:6px 0 8px; font-size:14px; color:var(--muted); letter-spacing:.2px; }
    .up-list { display:flex; flex-direction:column; gap:6px; max-height: 200px; overflow:auto; }
    .up-item { display:flex; align-items:center; gap:8px; background:#0f172a; border:1px solid #233044; border-radius:12px; padding:8px 10px; }
    .up-name { flex:1; font-size:14px; }
    .up-meta { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="container" id="app">
    <header>
      <h1>Тренировки</h1>
      <div class="row right">
        <button class="btn ghost" id="a2hs">На экран домой</button>
        <button class="btn" id="addWorkout">Новая</button>
      </div>
    </header>

    <div id="workoutList"></div>

    <section id="runSection" class="hidden"></section>
  </div>

  <dialog class="modal" id="editor">
    <header>
      <h3 style="margin:0">Редактор тренировки</h3>
      <div class="spacer"></div>
    </header>
    <main>
      <div class="field">
        <label>Название</label>
        <input class="input" id="wName" placeholder="Например: Табата утро" />
      </div>
      <div class="field">
        <label>Упражнения</label>
        <div id="exList" class="exlist"></div>
        <button class="btn secondary" id="addExBtn">Добавить упражнение</button>
      </div>
    </main>
    <footer>
      <button class="btn ghost" id="cancelEdit">Отмена</button>
      <button class="btn" id="saveWorkout">Сохранить</button>
    </footer>
  </dialog>

  <dialog class="modal" id="exEditor">
    <header>
      <h3 style="margin:0">Упражнение</h3>
      <div class="spacer"></div>
    </header>
    <main>
      <div class="field"><label>Название</label><input class="input" id="exName" placeholder="Берпи" /></div>
      <div class="grid">
        <div class="field"><label>Работа, сек</label><input type="number" class="input" id="exWork" min="5" max="600" step="5" value="20"/></div>
        <div class="field"><label>Отдых, сек</label><input type="number" class="input" id="exRest" min="0" max="600" step="5" value="10"/></div>
        <div class="field"><label>Сеты</label><input type="number" class="input" id="exSets" min="1" max="50" step="1" value="4"/></div>
      </div>
    </main>
    <footer>
      <button class="btn ghost" id="cancelEx">Отмена</button>
      <button class="btn" id="saveEx">Добавить</button>
    </footer>
  </dialog>

<script>
  // ==== Простая модель и хранилище ====
  const storeKey = 'wt_store_v2';
  let workouts = load() || [
    {
      "name": "Тренировка 1 — Грудь и Спина",
      "exercises": [
        { "name": "Подтягивания широким хватом", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Жим гантелей лёжа на скамье", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Разведение гантелей лёжа", "workSeconds": 35, "restSeconds": 20, "sets": 3 },
        { "name": "Тяга гантелей в наклоне", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Отжимания узким хватом", "workSeconds": 35, "restSeconds": 15, "sets": 3 },
        { "name": "Планка", "workSeconds": 45, "restSeconds": 15, "sets": 2 }
      ]
    },
    {
      "name": "Тренировка 2 — Ноги и Кор",
      "exercises": [
        { "name": "Приседания с гантелями", "workSeconds": 40, "restSeconds": 20, "sets": 4 },
        { "name": "Выпады на месте", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Ягодичный мост с гантелью", "workSeconds": 35, "restSeconds": 20, "sets": 3 },
        { "name": "Подъём на носки стоя", "workSeconds": 30, "restSeconds": 15, "sets": 4 },
        { "name": "Скручивания на пресс", "workSeconds": 30, "restSeconds": 15, "sets": 3 },
        { "name": "Планка боковая (левая/правая)", "workSeconds": 30, "restSeconds": 15, "sets": 2 }
      ]
    },
    {
      "name": "Тренировка 3 — Плечи и Руки",
      "exercises": [
        { "name": "Жим гантелей сидя (над головой)", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Жим Арнольда", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Разведения гантелей в стороны", "workSeconds": 35, "restSeconds": 20, "sets": 3 },
        { "name": "Молот на бицепс", "workSeconds": 35, "restSeconds": 20, "sets": 3 },
        { "name": "Французский жим лёжа", "workSeconds": 35, "restSeconds": 20, "sets": 3 },
        { "name": "Шраги с гантелями", "workSeconds": 40, "restSeconds": 15, "sets": 3 }
      ]
    },
    {
      "name": "Тренировка 4 — Комбо День (Полное тело)",
      "exercises": [
        { "name": "Подтягивания", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Жим гантелей лёжа", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Тяга гантелей в наклоне", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Приседания с гантелями", "workSeconds": 40, "restSeconds": 20, "sets": 3 },
        { "name": "Жим стоя", "workSeconds": 35, "restSeconds": 20, "sets": 3 },
        { "name": "Пресс (скручивания или ножницы)", "workSeconds": 35, "restSeconds": 15, "sets": 3 }
      ]
    }
  ];
  function save(){ localStorage.setItem(storeKey, JSON.stringify(workouts)); }
  function load(){ try { return JSON.parse(localStorage.getItem(storeKey)); } catch { return null; } }

  // ==== UI helpers ====
  const qs = (s,p=document)=>p.querySelector(s);
  function h(tag, props={}, ...children){ const el=document.createElement(tag); Object.assign(el, props); children.flat().forEach(c=>{ if(c==null) return; if(typeof c==='string') el.appendChild(document.createTextNode(c)); else el.appendChild(c); }); return el; }

  // ==== Главная: список тренировок ====
  const listRoot = qs('#workoutList');
  function renderList(){
    listRoot.innerHTML='';
    if(!workouts.length){
      listRoot.appendChild(h('div',{className:'empty'}, 'Пусто. Нажми “Новая”, чтобы создать тренировку.'));
      return;
    }
    const grid = h('div',{className:'list'});
    workouts.forEach(w=>{
      const totalEx = w.exercises.length;
      const totalTime = w.exercises.reduce((sum,ex)=> sum + (ex.workSeconds+ex.restSeconds)*ex.sets - ex.restSeconds, 0);
      const card = h('div',{className:'card'},
        h('h3',{}, w.name),
        h('div',{className:'sub'}, `${totalEx} упражн. • ${fmtTime(totalTime)}`),
        h('div',{className:'row', style:'margin-top:10px; gap:8px'},
          h('button',{className:'btn secondary', onclick:()=>openRun(w)}, 'Старт'),
          h('button',{className:'btn ghost', onclick:()=>openEditor(w)}, 'Редактировать'),
          h('div',{className:'spacer'}),
          h('button',{className:'btn danger', onclick:()=>delWorkout(w.id)}, 'Удалить'),
        ),
      );
      grid.appendChild(card);
    });
    listRoot.appendChild(grid);
  }

  function delWorkout(id){
    if(!confirm('Удалить эту тренировку?')) return;
    workouts = workouts.filter(w=>w.id!==id); save(); renderList();
  }

  // ==== Редактор тренировки ====
  const editor = qs('#editor');
  const wName = qs('#wName');
  const exListEl = qs('#exList');
  let editingWorkout = null;

  document.getElementById('addWorkout').onclick = ()=> openEditor();
  document.getElementById('cancelEdit').onclick = ()=> editor.close();
  document.getElementById('addExBtn').onclick = ()=> openExEditor();
  document.getElementById('saveWorkout').onclick = ()=>{
    const name = wName.value.trim();
    if(!name){ alert('Название не должно быть пустым'); return; }
    editingWorkout.name = name;
    if(editingWorkout.exercises.length===0){ alert('Добавь хотя бы одно упражнение'); return; }
    const idx = workouts.findIndex(w=>w.id===editingWorkout.id);
    if(idx>=0) workouts[idx] = editingWorkout; else workouts.push(editingWorkout);
    save(); editor.close(); renderList();
  };

  function openEditor(w){
    editingWorkout = w ? JSON.parse(JSON.stringify(w)) : { id: crypto.randomUUID(), name:'Новая', exercises: [] };
    wName.value = editingWorkout.name;
    renderExList();
    editor.showModal();
  }

  function renderExList(){
    exListEl.innerHTML='';
    if(!editingWorkout.exercises.length){
      exListEl.appendChild(h('div',{className:'muted'}, 'Пока пусто. Добавь упражнение.'));
      return;
    }
    editingWorkout.exercises.forEach(ex=>{
      const row = h('div',{className:'ex'},
        h('div',{className:'row', style:'justify-content:space-between; gap:8px'},
          h('div',{}, h('strong',{}, ex.name), h('div',{className:'sub'}, `Работа ${ex.workSeconds}s • Отдых ${ex.restSeconds}s • Сеты ${ex.sets}`)),
          h('div',{},
            h('button',{className:'btn ghost', onclick:()=>openExEditor(ex)}, 'Править'), ' ',
            h('button',{className:'btn danger', onclick:()=>{ editingWorkout.exercises = editingWorkout.exercises.filter(e=>e.id!==ex.id); renderExList(); }}, 'Удалить')
          )
        ),
      );
      exListEl.appendChild(row);
    });
  }

  // ==== Редактор упражнения ====
  const exEditor = qs('#exEditor');
  const exName = qs('#exName');
  const exWork = qs('#exWork');
  const exRest = qs('#exRest');
  const exSets = qs('#exSets');
  let editingExRef = null;

  function openExEditor(ex){
    editingExRef = ex || null;
    exName.value = ex?.name || '';
    exWork.value = ex?.workSeconds ?? 20;
    exRest.value = ex?.restSeconds ?? 10;
    exSets.value = ex?.sets ?? 4;
    document.getElementById('saveEx').textContent = ex ? 'Сохранить' : 'Добавить';
    exEditor.showModal();
  }
  document.getElementById('cancelEx').onclick = ()=> exEditor.close();
  document.getElementById('saveEx').onclick = ()=>{
    const name = exName.value.trim();
    const work = Math.max(1, parseInt(exWork.value||'20',10));
    const rest = Math.max(0, parseInt(exRest.value||'10',10));
    const sets = Math.max(1, parseInt(exSets.value||'4',10));
    if(!name){ alert('Название не должно быть пустым'); return; }
    const obj = { id: editingExRef?.id || crypto.randomUUID(), name, workSeconds: work, restSeconds: rest, sets };
    const i = editingWorkout.exercises.findIndex(e=>e.id===obj.id);
    if(i>=0) editingWorkout.exercises[i]=obj; else editingWorkout.exercises.push(obj);
    exEditor.close(); renderExList();
  };

  // ==== Экран запуска ====
  const runSection = qs('#runSection');
  let engine = null;
  function openRun(workout){
    qs('#app header').classList.add('hidden');
    listRoot.classList.add('hidden');
    runSection.classList.remove('hidden');
    engine = new TimerEngine(workout);
    renderRun();
  }
  function closeRun(){
    engine?.stop(); engine=null;
    qs('#app header').classList.remove('hidden');
    listRoot.classList.remove('hidden');
    runSection.classList.add('hidden');
    renderList();
  }

  function renderRun(){
    const w = engine.workout; const ex = engine.currentExercise();
    const total = engine.phase==='work' ? ex.workSeconds : ex.restSeconds || 1;
    const p = 1 - engine.remaining/total;
    runSection.innerHTML = '';

    const head = h('div',{className:'row'},
      h('button',{className:'btn ghost', onclick:closeRun}, 'Назад'),
      h('div',{className:'spacer'}),
      h('span',{className:'chip'}, `${engine.currentExerciseIndex+1}/${w.exercises.length}`),
      h('span',{className:'chip'}, `Сет ${engine.currentSet}/${ex.sets}`),
      h('span',{className:'chip'}, fmtTotalWorkoutLeft(engine)),
    );

    const title = h('h2',{style:'margin:8px 0 0; font-size:22px; text-align:center'}, ex.name);
    const phase = h('div',{className:'phase'}, engine.phase==='work' ? 'Работа' : (engine.phase==='rest' ? 'Отдых' : 'Готово'));

    const circle = h('div',{className:'circle', style:`--p:${p}turn; --ring-color:${engine.phase==='work'?'#34d399':'#93c5fd'}`},
      h('div',{className:'time'}, mmss(engine.remaining))
    );

    const controls = h('div',{className:'toolbar'},
      h('button',{className:'btn ghost', onclick:()=>{engine.reset(); renderRun();}}, 'Сброс'),
      h('button',{className:'btn', onclick:()=>{engine.toggle(); renderRun();}}, engine.running? 'Пауза' : 'Старт'),
      h('button',{className:'btn secondary', onclick:()=>{engine.skip();}}, 'Пропуск'),
    );

    // ==== Upcoming list ====
    const upBox = h('div',{className:'upcoming'},
      h('h4',{}, 'Предстоящие упражнения'),
      renderUpcoming(engine)
    );

    const wake = h('div',{style:'text-align:center'},
      h('button',{className:'btn ghost', onclick:toggleWake}, 'Не гасить экран')
    );

    runSection.append(head, title, phase, circle, controls, upBox, wake);
  }

  function renderUpcoming(engine){
    const w = engine.workout;
    const list = h('div',{className:'up-list'});
    // Текущий + все следующие
    for(let i=engine.currentExerciseIndex;i<w.exercises.length;i++){
      const ex = w.exercises[i];
      let leftSets = ex.sets;
      if(i===engine.currentExerciseIndex){ leftSets = ex.sets - (engine.currentSet-1); }
      const item = h('div',{className:'up-item'},
        h('div',{className:'up-name'}, ex.name),
        h('div',{className:'up-meta'}, `осталось сетов: ${leftSets}`)
      );
      list.appendChild(item);
    }
    return list;
  }

  function fmtTotalWorkoutLeft(engine){
    let left = 0;
    const w = engine.workout;
    for(let i=engine.currentExerciseIndex;i<w.exercises.length;i++){
      const ex = w.exercises[i];
      const startSet = (i===engine.currentExerciseIndex) ? engine.currentSet : 1;
      for(let s=startSet; s<=ex.sets; s++){
        const isCurrent = (i===engine.currentExerciseIndex && s===engine.currentSet);
        if(isCurrent){
          if(engine.phase==='work') left += engine.remaining + (ex.restSeconds) + (ex.sets - s)* (ex.workSeconds + ex.restSeconds);
          else if(engine.phase==='rest') left += engine.remaining + (ex.sets - s)* (ex.workSeconds + ex.restSeconds);
        } else {
          left += ex.workSeconds + (s<ex.sets? ex.restSeconds: 0);
        }
      }
    }
    return '≈ ' + fmtTime(left);
  }

  // ==== Движок таймера ====
  class TimerEngine{
    constructor(workout){ this.workout=workout; this.running=false; this.timer=null; this.currentExerciseIndex=0; this.currentSet=1; this.phase='work'; this.remaining=this.currentExercise().workSeconds; this._audioInit=false; }
    currentExercise(){ return this.workout.exercises[this.currentExerciseIndex]; }
    reset(){ this.stop(); this.currentExerciseIndex=0; this.currentSet=1; this.phase='work'; this.remaining=this.currentExercise().workSeconds; renderRun(); }
    stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } this.running=false; }
    toggle(){ if(this.running){ this.stop(); return;} this.running=true; if(!this._audioInit){ unlockAudio(); this._audioInit=true; } this.timer=setInterval(()=>{ if(this.remaining>0){ this.remaining--; // обратный отсчёт
        // Звуки 3-2-1 перед началом нового подхода (в конце отдыха)
        if(this.phase==='rest'){
          if(this.remaining===2) beepShort();
          if(this.remaining===1) beepShort();
          if(this.remaining===0) beepLong();
        }
      } else { this._tickComplete(); } renderRun(); }, 1000); }
    skip(){ this._tickComplete(); renderRun(); }
    _tickComplete(){
      if(this.phase==='finished') return;
      const ex = this.currentExercise();
      if(this.phase==='work'){
        if(ex.restSeconds>0){ this.phase='rest'; this.remaining=ex.restSeconds; beep(); }
        else { this._advance(); }
      } else if(this.phase==='rest') { this._advance(); }
    }
    _advance(){
      const ex = this.currentExercise();
      if(this.currentSet < ex.sets){ this.currentSet++; this.phase='work'; this.remaining=ex.workSeconds; beep(); return; }
      if(this.currentExerciseIndex < this.workout.exercises.length-1){ this.currentExerciseIndex++; this.currentSet=1; this.phase='work'; this.remaining=this.currentExercise().workSeconds; beep(); return; }
      this.phase='finished'; this.stop(); beep(); this.remaining=0;
    }
  }

  // ==== Аудио (бип) ====
  let audioCtx=null;
  function unlockAudio(){
    try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=1; g.gain.value=0; o.start(); setTimeout(()=>{ o.stop(); }, 10); } catch(e){ }
  }
  function beep(){ // переход
    if(!audioCtx){ try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; } }
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.value=0.0001;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    const now=audioCtx.currentTime; g.gain.exponentialRampToValueAtTime(0.25, now+0.01); g.gain.exponentialRampToValueAtTime(0.0001, now+0.18);
    o.stop(now+0.2);
  }
  function beepShort(){ // «пип»
    if(!audioCtx){ try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; } }
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=900;
    g.gain.value=0.0001; o.connect(g); g.connect(audioCtx.destination);
    const now=audioCtx.currentTime; o.start(); g.gain.exponentialRampToValueAtTime(0.18, now+0.01); g.gain.exponentialRampToValueAtTime(0.0001, now+0.08); o.stop(now+0.09);
  }
  function beepLong(){ // «пииииип»
    if(!audioCtx){ try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; } }
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=1100;
    g.gain.value=0.0001; o.connect(g); g.connect(audioCtx.destination);
    const now=audioCtx.currentTime; o.start(); g.gain.exponentialRampToValueAtTime(0.25, now+0.01); g.gain.exponentialRampToValueAtTime(0.0001, now+0.35); o.stop(now+0.36);
  }

  // ==== Wake Lock (не гасить экран) ====
  let wakeLock=null;
  async function toggleWake(){
    if('wakeLock' in navigator){
      try{
        if(!wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); alert('Экран не будет гаснуть (пока открыт таймер).'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }
        else { wakeLock.release(); wakeLock=null; alert('Wake Lock выключен.'); }
      }catch(e){ alert('Не удалось включить Wake Lock: '+e.message); }
    } else {
      alert('Wake Lock не поддерживается в этом браузере. Оставь экран включённым вручную.');
    }
  }

  // ==== Форматы времени ====
  function mmss(s){ const m = Math.floor(s/60); const ss = s%60; return `${m}:${ss.toString().padStart(2,'0')}`; }
  function fmtTime(s){ const m = Math.floor(s/60), ss=s%60; if(m>0) return `${m} мин ${ss? ss+' с':''}`.trim(); return `${ss} с`; }

  // ==== A2HS подсказка для iPhone ====
  document.getElementById('a2hs').onclick = ()=>{
    alert(`Как добавить на главный экран iPhone:\n\n1) Открой эту страницу в Safari.\n2) Нажми Поделиться (квадрат со стрелкой).\n3) Выбери «На экран Домой».\n4) Открой с иконки — будет полноэкранно и офлайн.`);
  };

  // ==== Инициализация ====
  renderList();
</script>
